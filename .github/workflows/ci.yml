name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ProjectTaskManagement.slnx

      - name: Build solution
        run: dotnet build ProjectTaskManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/ProjectTaskManagement.UnitTests/ProjectTaskManagement.UnitTests.csproj --configuration Release --no-build --no-restore
